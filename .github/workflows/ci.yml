name: ci

on:
  push:
  pull_request:

jobs:
  golden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dev dependencies
        run: python -m pip install -e ".[dev]"
      - name: Compile Python files
        run: python -m compileall scripts src
      - name: Validate JSON fixtures
        run: |
          python -m json.tool references/governed-effect-ir-v0.schema.json >/tmp/fermata_schema.json
          python -m json.tool references/tongue-golden-tests-v0.json >/tmp/fermata_golden.json
      - name: Validate JSONL corpus is parseable
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('references/ai-native-tongue-seed-corpus-v0.jsonl')
          count = 0
          for line in path.read_text().splitlines():
              if line.strip():
                  json.loads(line)
                  count += 1
          assert count == 24, count
          print({'jsonl_records': count})
          PY
      - name: Run governed-effect golden checks
        run: python scripts/run_tongue_golden_tests.py
      # The custody_mode drift guard runs here rather than as a local-alpha gate:
      # the validator's gate list is pinned by the published release notes, and
      # adding a gate there would retroactively rewrite what v0.1.1 shipped with.
      - name: Check custody_mode IR drift guard
        run: python scripts/check_custody_mode_ir.py
      - name: Run local alpha validator
        run: python scripts/validate_local_alpha.py
